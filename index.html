<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2a24;--mu:#6b756f;--ac:#c8283f;--ac2:#fde8ec;--on:#fff;--bd:#e2e0d8;--wa:#b4531a;--rd:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1d2521;--tx:#e8eee9;--mu:#98a49d;--ac:#ff7f90;--ac2:#3a1f26;--on:#2a0f14;--bd:#2c3731;--wa:#e8914f;--rd:#f2877f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:0}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.on,button.p{background:var(--ac);color:var(--on);border-color:var(--ac)}button.d{color:var(--rd)}button:disabled{opacity:.5;cursor:default}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.g .c{margin:0}
.s b{display:block;font-size:26px;color:var(--ac)}.s span,.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0}
.tag.w2{background:transparent;border:1px solid var(--wa);color:var(--wa)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--bd)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
input,textarea,select{font:inherit;width:100%;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{font-size:12px;color:var(--mu);display:block}.full{grid-column:1/-1}.bar{height:8px;background:var(--ac);border-radius:4px}
.al{background:var(--ac2);border-left:4px solid var(--ac);padding:8px 12px;border-radius:8px;margin-bottom:8px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px;border-top:1px solid var(--bd)}.ov{overflow-x:auto}
</style></head><body><div class="w" id="app">Loading…</div>
<script>
const UIV=4;
let B={org:'Big At Heart',logo:''},S=null,tab='opps',tok='',em='',step=0,err='';
try{tok=localStorage.getItem('vh_t')||''}catch(e){}
const $=s=>document.querySelector(s);
const logo=h=>B.logo?`<img src="${B.logo}" alt="" style="height:${h}px;width:auto;vertical-align:middle">`:`<svg viewBox="0 0 24 24" width="${h}" height="${h}" style="vertical-align:middle"><path fill="var(--ac)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const API='https://script.google.com/macros/s/AKfycbxLgAmJrpwZ_sppo2BuuDcccee14PAxHM0Un6mZqnqsvGDuxuy_VUoRnF7-uVs3lia_/exec';
const call=async(a,p)=>{try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a,t:tok||'',p:p||{}})});
  if(!r.ok)return{error:'Server error ('+r.status+')'};const j=await r.json();return j||{error:'No response from server'}}
  catch(e){return{error:'Could not reach the server. Please check your connection and try again.'}}};
const nowStr=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())};
const isPast=o=>(o.date+' '+o.end)<nowStr();
const canWd=o=>S.today<=o.withdrawBy&&!isPast(o);
const oppOf=id=>S.opps.find(o=>o.id===id);
const sups=()=>S.all||S.mine;
const cnt=o=>S.counts[o.id]||0;
const ah=s=>s.attended!=='yes'?0:(s.hours===''||s.hours==null?+oppOf(s.oppId)?.hours||0:+s.hours||0);
const hrs=l=>l.reduce((a,s)=>a+ah(s),0);
const roles=o=>{try{const a=JSON.parse(o.roles);if(a&&a.length)return a}catch(e){}return[{name:'Volunteer',tasks:o.tasks||'',cap:+o.capacity||0}]};
const roleOf=s=>{const rs=roles(oppOf(s.oppId));return rs.find(r=>r.name===s.role)||rs[0]};
const rcnt=(o,r)=>((S.rc||{})[o.id]||{})[r.name]||0;
const roleRow=()=>`<div class="rr c" style="padding:10px;margin:6px 0"><div class="f"><div><label>Role name</label><input class="rn" placeholder="e.g. Registration desk"></div><div><label>Spots (blank = unlimited)</label><input class="rc" type="number" min="1"></div><div class="full"><label>Tasks for this role</label><input class="rt"></div></div><button class="d" data-a="rmrole" style="margin-top:6px">Remove role</button></div>`;
async function load(a,p){const r=await call(a||'list',p);
  if(r.error==='auth'){tok='';S=null;step=0;err='Your session expired. Please sign in again.'}else if(r.error){alert(r.error);return}else S=r;try{render()}catch(x){alert('Display error: '+x.message)}}
function render(){
  if(!S){$('#app').innerHTML=`<div class="c" style="max-width:420px;margin:40px auto"><div style="text-align:center">${logo(64)}<h1 style="margin-top:6px">Big At Heart Volunteer Hub</h1><p class="mu" style="font-style:italic">Come find your volunasia</p></div><p class="mu">Sign in with your email — we'll send you a one-time code.</p>
  ${step===0?`<label>Email</label><input id="e" type="email" value="${esc(em)}" autocomplete="email"><p class="mu">New here? After verifying your email you\u2019ll complete a quick one-time sign-up.</p><p><button class="p" data-a="code">Email me a code</button></p>`
  :`<label>6-digit code sent to ${esc(em)}</label><input id="k" inputmode="numeric" maxlength="6"><p><button class="p" data-a="verify">Sign in</button> <button data-a="back">Back</button></p>`}
  <div style="color:var(--rd)">${esc(err)}</div></div>`;return}
  if(!S.profile){$('#app').innerHTML=onboard();return}
  const T=[['opps','Opportunities'],['my','My activity'],['profile','My profile']].concat(S.admin?[['manage','Manage & attendance'],['dash','Dashboard']]:[]);
  if(!T.some(t=>t[0]===tab))tab='opps';
  $('#app').innerHTML=`<header><div><h1>${logo(32)} Big At Heart Volunteer Hub</h1><div class="mu">${esc(S.email)} · ${S.admin?'Admin':'Volunteer'}</div></div><button data-a="out">Sign out</button></header>
  <div class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${{opps:vOpps,my:vMy,profile:vProfile,manage:vManage,dash:vDash}[tab]()}<div class="mu" style="margin:18px 0 6px;text-align:center">Big At Heart Volunteer Hub · page v${UIV} · server v${S.ver||'old'}</div>`;
}
function pform(p,isNew){
  const L=S.lists,o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  return `<div class="f">
  <div><label>Email (cannot be changed)</label><input value="${esc(S.email)}" disabled></div>
  <div><label>Name as you need on the certificate${isNew?'':' (cannot be changed)'}</label><input id="pf_name" value="${esc(p.name||'')}" ${isNew?'':'disabled'}></div>
  <div><label>Gender${isNew?'':' (cannot be changed)'}</label><select id="pf_gender" ${isNew?'':'disabled'}><option value="">Select…</option>${o(L.genders,p.gender)}</select></div>
  <div><label>Date of birth${isNew?'':' (cannot be changed)'}</label><input id="pf_dob" type="date" max="${S.today}" value="${esc(p.dob||'')}" ${isNew?'':'disabled'}></div>
  ${isNew?`<div class="full mu">Your name, gender and date of birth cannot be changed after sign-up, so please check them carefully.</div>`:''}
  <div class="full"><label>Address in Singapore (include the 6-digit postal code)</label><textarea id="pf_addr" rows="2">${esc(p.address||'')}</textarea></div>
  <div><label>Organisation type</label><select id="pf_type"><option value="">Select…</option>${o(L.orgTypes,p.orgType)}</select></div>
  <div><label>Organisation name (optional for Individuals and Groups)</label><input id="pf_org" value="${esc(p.orgName||'')}"></div>
  ${isNew?`<div class="full"><label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--tx)"><input type="checkbox" id="pf_consent" style="width:auto;margin-top:4px"> I consent to Big At Heart collecting, using and storing my personal details to manage my volunteering, issue certificates and contact me, in line with Singapore\u2019s PDPA.</label></div>`:''}
  <div class="full"><button class="p" data-a="psave" data-n="${isNew?1:0}">${isNew?'Complete sign-up':'Save changes'}</button></div></div>`;
}
function onboard(){return `<div class="c" style="max-width:640px;margin:24px auto"><div style="text-align:center">${logo(56)}<h1 style="margin-top:6px">Welcome to Big At Heart Volunteer Hub</h1></div><p class="mu">Your email is verified. Please complete this one-time sign-up. You can edit your details later from the My profile tab (except your email).</p>${pform({},true)}<p style="text-align:right"><button data-a="out">Sign out</button></p></div>`}
function vProfile(){const h=S.history||[];return `<div class="c"><h2>My profile</h2>${pform(S.profile,false)}</div>
  <div class="c"><h2>Change history</h2>${h.map(x=>`<div class="row"><div><b>Version ${esc(x.version)}</b> <span class="tag ${x.status==='Old'?'w2':''}">${esc(x.status)}</span><div class="mu">${esc(x.changedAt)}</div></div><div class="mu" style="max-width:62%">${esc(x.changes)}</div></div>`).join('')}</div>`}
function oppCard(o,am){
  const s=S.mine.find(x=>x.oppId===o.id),reg=s&&s.status==='registered',past=isPast(o),rs=roles(o);let b='';
  if(!am&&reg)b=canWd(o)?`<button class="d" data-a="wd" data-v="${o.id}">Withdraw</button>`:`<span class="tag w2">Withdrawal closed</span>`;
  return `<div class="c"><div class="row" style="border:0;padding:0"><h3>${esc(o.title)}</h3><div>${reg?`<span class="tag">You\u2019re signed up as ${esc(roleOf(s).name)}</span>`:''}${past?'<span class="tag w2">Completed</span>':''}${b}</div></div>
  <div class="mu">📅 ${fd(o.date)} · ${esc(o.start)}–${esc(o.end)} · 📍 ${esc(o.venue)} · ⏱ ${esc(o.hours)} h · 👥 ${cnt(o)} signed up</div>
  <p style="margin:6px 0">${esc(o.desc)}</p><div>${(o.skills||'').split(',').filter(x=>x.trim()).map(k=>`<span class="tag">${esc(k.trim())}</span>`).join('')}</div>
  <div class="mu" style="margin:4px 0">Withdraw until ${fd(o.withdrawBy)}</div>
  ${(!am&&reg?rs.filter(r=>r.name===roleOf(s).name):rs).map((r,i)=>{const n=rcnt(o,r),full=+r.cap&&n>=+r.cap;return `<div class="row"><div><b>${esc(r.name)}</b>${r.tasks?` <span class="mu">– ${esc(r.tasks)}</span>`:''}<div class="mu">👥 ${n}${+r.cap?'/'+r.cap:' (no limit)'}</div></div>${!am&&!reg&&!past?`<button class="p" data-a="su" data-v="${o.id}" data-r="${i}" ${full?'disabled':''}>${full?esc(r.name)+' – Full':'Sign up as '+esc(r.name)}</button>`:''}</div>`}).join('')}`+(am?'':'</div>');
}
function vOpps(){
  const up=S.opps.filter(o=>!isPast(o));
  const soon=S.mine.filter(s=>s.status==='registered').map(s=>oppOf(s.oppId)).filter(o=>o&&!isPast(o)&&o.date<=new Date(Date.now()+864e5).toISOString().slice(0,10));
  return soon.map(o=>`<div class="al">🔔 Reminder: <b>${esc(o.title)}</b> is ${fd(o.date)} at ${esc(o.start)}, ${esc(o.venue)}.</div>`).join('')+(up.length?up.map(o=>oppCard(o)).join(''):'<div class="c mu">No upcoming opportunities yet.</div>');
}
function vMy(){
  const m=S.mine.filter(s=>oppOf(s.oppId)),tot=hrs(m);
  return `<div class="g"><div class="c s"><b>${tot}</b><span>Verified hours</span></div><div class="c s"><b>${m.filter(s=>s.attended==='yes').length}</b><span>Activities attended</span></div><div class="c s"><b>${m.filter(s=>s.status==='registered'&&!isPast(oppOf(s.oppId))).length}</b><span>Upcoming</span></div></div>
  <div class="c"><div class="row" style="border:0;padding:0"><h2>My volunteering</h2><span><button class="p" data-a="certAll" data-f="pdf" ${tot?'':'disabled'}>⬇ Hours certificate (PDF)</button> <button data-a="certAll" data-f="jpg" ${tot?'':'disabled'}>⬇ JPEG</button></span></div>
  ${m.length?m.map(s=>{const o=oppOf(s.oppId),st=s.status==='withdrawn'?'Withdrawn':s.attended==='yes'?'Attended':s.attended==='no'?'Absent':isPast(o)?'Awaiting attendance':'Registered';
  return `<div class="row"><div><b>${esc(o.title)}</b><div class="mu">${fd(o.date)} · <b>${esc(roleOf(s).name)}</b>${roleOf(s).tasks?' ('+esc(roleOf(s).tasks)+')':''} · ${s.attended==='yes'?ah(s)+' of '+esc(o.hours)+' h attended':esc(o.hours)+' h'} · ${esc(o.venue)}</div></div><div><span class="tag ${st==='Absent'||st==='Withdrawn'?'w2':''}">${st}</span>${s.cert&&s.attended==='yes'?`<button data-a="certOne" data-f="pdf" data-v="${s.id}">⬇ PDF</button> <button data-a="certOne" data-f="jpg" data-v="${s.id}">⬇ JPEG</button>`:''}</div></div>`}).join(''):'<p class="mu">Nothing yet.</p>'}</div>`;
}
function vManage(){
  const f=`<div class="c"><h2>Create opportunity</h2><div class="f">
  <div class="full"><label>Title</label><input id="f_t"></div><div><label>Date</label><input id="f_d" type="date"></div><div><label>Start</label><input id="f_s" type="time"></div><div><label>End</label><input id="f_e" type="time"></div>
  <div><label>Venue</label><input id="f_v"></div><div><label>Full duration (hours)</label><input id="f_h" type="number" min="0.5" step="0.5"></div><div><label>Withdraw allowed until</label><input id="f_w" type="date"></div>
  <div class="full"><label>Skills required (comma separated)</label><input id="f_k"></div><div class="full"><label>Description</label><textarea id="f_x" rows="2"></textarea></div>
  <div class="full"><label>Roles needed (each with its own spots and tasks)</label><div id="roles">${roleRow()}</div><button data-a="addrole">+ Add another role</button></div>
  <div class="full"><button class="p" data-a="create">Publish opportunity</button> <span class="mu" id="msg"></span></div></div></div>`;
  return f+'<h2>Opportunities &amp; attendance</h2>'+[...S.opps].reverse().map(o=>{
    const reg=sups().filter(s=>s.oppId===o.id&&s.status==='registered'),past=isPast(o);
    return oppCard(o,true)+`<div class="row"><b>${reg.length} signed up</b><button class="d" data-a="del" data-v="${o.id}">Delete</button></div>
    ${past?`<div class="row"><b>Attendance &amp; hours attended</b><button data-a="issueAll" data-v="${o.id}">Issue certificates to all present</button></div>`:'<div class="mu">Attendance opens after the event.</div>'}
    ${reg.map(s=>`<div class="row"><span>${esc(s.name||'Unnamed')} <span class="mu">${esc(s.email)} · ${esc(roleOf(s).name)}</span></span>${past?`<span><input type="number" id="h_${esc(s.id)}" min="0.25" max="24" step="0.25" value="${s.attended==='yes'?ah(s):esc(o.hours)}" style="width:80px" title="Hours attended"> h <button class="${s.attended==='yes'?'on':''}" data-a="att" data-v="${esc(s.id)}" data-p="1">${s.attended==='yes'?'Update hours':'Present'}</button> <button class="${s.attended==='no'?'on':''}" data-a="att" data-v="${esc(s.id)}" data-p="0">Absent</button> ${s.attended==='yes'?`<button data-a="cert" data-v="${esc(s.id)}">${s.cert?'✓ Certificate issued':'Issue certificate'}</button>`:''}</span>`:''}</div>`).join('')}</div>`}).join('')||'<div class="c mu">Nothing created yet.</div>';
}
function vDash(){
  const A=S.all,pres=A.filter(s=>s.attended==='yes'),marked=A.filter(s=>s.attended),by={};
  pres.forEach(s=>{const k=s.email;by[k]=by[k]||{n:s.name||s.email,h:0,c:0};by[k].h+=ah(s);by[k].c++});
  const top=Object.values(by).sort((a,b)=>b.h-a.h).slice(0,8),mx=Math.max(1,...S.opps.map(cnt));
  return `<div class="g">${[[S.opps.length,'Opportunities'],[S.opps.filter(isPast).length,'Completed'],[new Set(A.filter(s=>s.status==='registered').map(s=>s.email)).size,'Unique volunteers'],[hrs(A),'Hours delivered'],[(marked.length?Math.round(pres.length/marked.length*100):0)+'%','Attendance rate'],[A.filter(s=>s.cert).length,'Certificates issued']].map(x=>`<div class="c s"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
  <div class="c"><h2>Sign-ups per opportunity</h2>${S.opps.map(o=>`<div style="margin:6px 0"><div class="mu">${esc(o.title)} · ${fd(o.date)} · ${cnt(o)}</div><div class="bar" style="width:${cnt(o)/mx*100}%"></div></div>`).join('')||'<p class="mu">No data yet.</p>'}</div>
  <div class="c ov"><h2>Roles filled</h2><table><tr><th>Opportunity</th><th>Role</th><th>Filled</th></tr>${S.opps.map(o=>roles(o).map(r=>`<tr><td>${esc(o.title)}</td><td>${esc(r.name)}</td><td>${rcnt(o,r)}${+r.cap?'/'+r.cap:''}</td></tr>`).join('')).join('')||'<tr><td colspan="3" class="mu">No data yet.</td></tr>'}</table></div>
  <div class="c ov"><h2>Volunteers by organisation type</h2><table><tr><th>Type</th><th>Volunteers</th></tr>${Object.entries(S.orgTypes||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')||'<tr><td colspan="2" class="mu">No profiles yet.</td></tr>'}</table></div>
  <div class="c ov"><h2>Top volunteers</h2><table><tr><th>Name</th><th>Activities</th><th>Hours</th></tr>${top.map(t=>`<tr><td>${esc(t.n)}</td><td>${t.c}</td><td>${t.h}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">No attendance recorded yet.</td></tr>'}</table></div>`;
}
const BROWN='#73330C',SERIF='Georgia,"Times New Roman",serif';
const hh=n=>(+n)+(+n===1?' Hour':' Hours');
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
function wrapTxt(x,t,maxW){const out=[];let l='';t.split(/\s+/).forEach(w=>{const s=l?l+' '+w:w;if(x.measureText(s).width>maxW&&l){out.push(l);l=w}else l=s});if(l)out.push(l);return out}
const certName=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return myName().replace(/[\\\/:*?"<>|]+/g,'').trim()+'_BigAtHeart_Volunteering_Certificate_'+z(d.getDate())+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+d.getFullYear()};
const t12=t=>{const[a,b]=String(t).split(':').map(Number);return ((a%12)||12)+':'+String(b).padStart(2,'0')+' '+(a<12?'AM':'PM')};
async function makeCert(d){
  const bg=await loadImg(BG),W=2400,H=Math.round(W*bg.height/bg.width),pt=W/780;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.drawImage(bg,0,0,W,H);x.textBaseline='alphabetic';
  const put=(t,fx,fy,sz,o={})=>{x.font=`${o.i?'italic ':''}${o.b?'bold ':''}${sz*pt}px ${SERIF}`;x.fillStyle=o.c||'#000';x.textAlign=o.a||'center';x.fillText(t,fx*W,fy*H)};
  const fit=(t,maxW,sz,o)=>{while(sz>9){x.font=`${o.b?'bold ':''}${sz*pt}px ${SERIF}`;if(x.measureText(t).width<=maxW)break;sz-=1}return sz};
  const lines=(t,fx,fy,sz,maxW,maxLines)=>{let L;for(;;){x.font=`${sz*pt}px ${SERIF}`;L=wrapTxt(x,t,maxW);if(L.length<=maxLines||sz<=9)break;sz-=1}
    if(L.length>maxLines){L=L.slice(0,maxLines);L[maxLines-1]=L[maxLines-1].replace(/\s*\S*$/,'')+'\u2026'}
    L.forEach((s,i)=>put(s,fx,fy-(L.length-1-i)*.03,sz))};
  put(d.name,.503,.395,fit(d.name,.7*W,22,{}));
  lines(d.role,.528,.513,14,.68*W,1);
  lines(d.task,.528,.583,14,.68*W,2);
  lines(d.when,.528,.651,14,.68*W,1);
  put('Signed off by Big At Heart',.5,.885,16,{b:1,c:BROWN});
  put('System generated certificate. Does not need a signature.',.5,.934,9,{i:1,c:'#555'});
  {const t='www.bigatheart.org  |  team@bigatheart.org  |  Facebook: TheBigAtHeart  |  Instagram: TheBigAtHeart';put(t,.5,.962,fit(t,.64*W,9,{}),{c:'#444'})}
  return c;
}
function dlBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function savePdf(d,fname,fmt){
  const cv=await makeCert(d),J=window.jspdf&&window.jspdf.jsPDF;
  if(fmt==='jpg'){cv.toBlob(b=>dlBlob(b,fname.replace(/\.pdf$/,'.jpg')),'image/jpeg',.92);return}
  if(!J){cv.toBlob(b=>dlBlob(b,fname.replace(/\.pdf$/,'.png')));alert('The PDF library could not load, so a PNG image was downloaded instead.');return}
  const pw=297,ph=pw*cv.height/cv.width,pdf=new J({orientation:'landscape',unit:'mm',format:[pw,ph]});
  pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,ph);pdf.save(fname);
}

    await savePdf({name:myName(),role:roleOf(s).name,task:o.title,when:fd(o.date)+' | '+hh(ah(s))},certName()+'.pdf',b.dataset.f);b.disabled=false}

    await savePdf({name:myName(),role:[...new Set(at.map(s=>roleOf(s).name))].join(', '),task:at.length+' volunteering '+(at.length===1?'activity':'activities'),when:(ds[0]===ds[ds.length-1]?fd(ds[0]):fd(ds[0])+' to '+fd(ds[ds.length-1]))+' | '+hh(hrs(S.mine))},certName()+'.pdf',b.dataset.f);b.disabled=false}
}
